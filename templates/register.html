<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>Registrierung</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}" />
</head>
<body>

    <div class="login-box">
        <h1>Registrierung</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Wähle deinen Benutzernamen" required />
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Wähle dein Passwort" required />
            </div>

            <button class="login-btn" type="submit">REGISTRIEREN</button>
        </form>

        <div class="divider">Oder hast du schon ein Konto?</div>

        <div class="signup">
            <a href="{{ url_for('login') }}">Login</a>
        </div>
    </div>

</body>
</html>
