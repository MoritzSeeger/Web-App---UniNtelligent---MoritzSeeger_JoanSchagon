<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>5 Sliders (1–10)</title>
  <style>
    .slider-container {
      width: 300px;
      margin: 20px;
      font-family: Arial, sans-serif;
    }

    .slider-row {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .slider-row label {
      width: 80px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      margin: 0 10px;
    }

    .slider-value {
      width: 30px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
<h1>Wählen Sie ihren bevorzugten Learn-Attribute aus</h1>
  <div class="slider-container">
    <div class="slider-row">
      <label for="slider1">Slider 1</label>
      <input type="range" id="slider1" min="1" max="10" step="1" value="1">
      <span class="slider-value" id="value1">1</span>
    </div>

    <div class="slider-row">
      <label for="slider2">Slider 2</label>
      <input type="range" id="slider2" min="1" max="10" step="1" value="1">
      <span class="slider-value" id="value2">1</span>
    </div>

    <div class="slider-row">
      <label for="slider3">Slider 3</label>
      <input type="range" id="slider3" min="1" max="10" step="1" value="1">
      <span class="slider-value" id="value3">1</span>
    </div>

    <div class="slider-row">
      <label for="slider4">Slider 4</label>
      <input type="range" id="slider4" min="1" max="10" step="1" value="1">
      <span class="slider-value" id="value4">1</span>
    </div>

    <div class="slider-row">
      <label for="slider5">Slider 5</label>
      <input type="range" id="slider5" min="1" max="10" step="1" value="1">
      <span class="slider-value" id="value5">1</span>
    </div>
  </div>

  <script>

    for (let i = 1; i <= 5; i++) {
      const slider = document.getElementById(`slider${i}`);
      const valueDisplay = document.getElementById(`value${i}`);

      slider.addEventListener("input", () => {
        valueDisplay.textContent = slider.value;
      });
    }
  </script>

</body>
</html>
